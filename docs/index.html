<style>
/* Layout: one-column mobile tool — sticky header with scan button + 4 tabs, list rows, bottom sheet for actions */
:root{
  --bg:#FFF6EE; --surface:#FFFFFF; --sunk:#FCEBDD; --fg:#22140E; --muted:#7D6253; --line:#F1DAC8;
  --accent:#E8410F; --accent-fg:#FFFFFF; --accent-soft:#FFE4D4;
  --grad:linear-gradient(135deg,#FF8A00 0%,#F2491B 55%,#C8102E 100%);
  --ok:#14804A; --ok-bg:#D9F4E3; --warn:#B25E00; --warn-bg:#FFEBC7; --bad:#C8102E; --bad-bg:#FFDCDF; --none:#7D6253; --none-bg:#F3E6DC;
  --shadow:0 12px 32px rgba(120,40,10,.22);
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130C09; --surface:#1E1410; --sunk:#2B1D17; --fg:#FBEFE6; --muted:#BFA392; --line:#3B2A21;
  --accent:#FF7A2E; --accent-fg:#1A0B04; --accent-soft:#3A1E10;
  --grad:linear-gradient(135deg,#FF9A1F 0%,#FF5A26 55%,#E0243D 100%);
  --ok:#5FD896; --ok-bg:#123324; --warn:#FFBE5C; --warn-bg:#3A2A10; --bad:#FF7A86; --bad-bg:#3E1519; --none:#BFA392; --none-bg:#2E211B;
  --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130C09; --surface:#1E1410; --sunk:#2B1D17; --fg:#FBEFE6; --muted:#BFA392; --line:#3B2A21;
  --accent:#FF7A2E; --accent-fg:#1A0B04; --accent-soft:#3A1E10;
  --grad:linear-gradient(135deg,#FF9A1F 0%,#FF5A26 55%,#E0243D 100%);
  --ok:#5FD896; --ok-bg:#123324; --warn:#FFBE5C; --warn-bg:#3A2A10; --bad:#FF7A86; --bad-bg:#3E1519; --none:#BFA392; --none-bg:#2E211B;
  --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1A0E0A}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:#FFF3EA;background:radial-gradient(120% 140% at 0% 0%,#4A1A0C 0%,#24110B 45%,#150B08 100%);box-shadow:0 6px 24px rgba(60,15,5,.35);border-bottom:2px solid transparent;border-image:var(--grad) 1}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:46px;height:46px;border-radius:14px;flex:none;object-fit:cover;box-shadow:0 0 0 2px rgba(255,140,40,.9),0 6px 18px rgba(255,90,20,.45)}
header .btn.ghost{background:rgba(255,255,255,.1);color:#FFF3EA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
h1{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em}
h1{background:linear-gradient(90deg,#FFFFFF,#FFD2A8);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:#E9B999;-webkit-text-fill-color:#E9B999;letter-spacing:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tile-main{border:0;background:none;color:var(--fg);text-align:left;padding:10px 12px;cursor:pointer;display:grid;gap:2px;min-width:0}
.tile-main:hover{background:var(--sunk)}
.tile-minus{border:0;border-left:1px solid var(--line);background:var(--warn-bg);color:var(--warn);font:800 18px var(--f-display);min-width:56px;cursor:pointer}
.tile-minus.w{background:var(--bad-bg);color:var(--bad)}
.tile-minus:disabled{background:var(--sunk);color:var(--muted);cursor:default}
.tile-minus:active:not(:disabled){filter:brightness(.92)}
.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:18px}
.today summary{font-weight:600}
.toast button{margin-left:12px;border:0;background:none;color:inherit;font:700 14px var(--f-body);text-decoration:underline;cursor:pointer;padding:0}
.tab{border:0;background:rgba(255,255,255,.07);color:#F3D9C7;font:600 13.5px var(--f-body);padding:9px 4px;border-radius:10px;cursor:pointer;display:flex;justify-content:center;gap:5px;align-items:center;min-width:0}
.tab[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(242,73,27,.45)}
.badge{font-size:11.5px;min-width:19px;padding:1px 5px;border-radius:99px;background:var(--bad);color:#fff;font-variant-numeric:tabular-nums}
button{font-family:inherit}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px var(--f-body);cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(232,65,15,.28);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.ghost{background:var(--sunk);color:var(--fg);box-shadow:none}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.scanbtn{padding:10px 14px}
.scanbtn svg{width:20px;height:20px}
.btn:focus-visible,.tab:focus-visible,.row:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:14px 100px}
.tools{display:grid;gap:10px;margin-bottom:12px}
input,select,textarea{font:15px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left;color:var(--fg)}
.sum b{display:block;font-family:var(--f-display);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.sum[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg2{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg2 button{border:0;background:none;color:var(--muted);font:600 12.5px var(--f-body);padding:5px 10px;border-radius:8px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.group{margin-top:18px}
.group h2{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(120,40,10,.06)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-top:1px solid var(--line);width:100%;background:none;color:var(--fg);text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.rmain{flex:1;min-width:0}
.rname{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.bc{display:inline-block;width:14px;height:10px;margin-left:5px;vertical-align:0;background:repeating-linear-gradient(90deg,var(--muted) 0 1.5px,transparent 1.5px 3px,var(--muted) 3px 4px,transparent 4px 6px);opacity:.8}
.rqty{text-align:right;flex:none}
.rqty b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.rqty small{font-size:12px;color:var(--muted);margin-left:3px}
.pill{display:inline-block;font:600 11px var(--f-body);padding:2px 8px;border-radius:99px;margin-top:2px;letter-spacing:.02em}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-none{background:var(--none-bg);color:var(--none)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:14px}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;box-shadow:var(--shadow);border-radius:99px;padding:13px 20px;font-size:15px}
.ord-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ord-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ord-head h3{font-family:var(--f-display);margin:0;font-size:17px}
.ord-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.ord-line:first-of-type{border-top:0}
.ord-line input,.cnt input{width:84px;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
.log{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.log-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.log-item:first-child{border-top:0}
.kind{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 16px var(--f-display)}
.k-in{background:var(--ok-bg);color:var(--ok)}.k-out{background:var(--warn-bg);color:var(--warn)}.k-waste{background:var(--bad-bg);color:var(--bad)}.k-count{background:var(--accent-soft);color:var(--accent)}.k-edit{background:var(--none-bg);color:var(--none)}
.log-when{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* count mode */
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--grad);border-radius:99px}
.cnt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.cnt:first-child{border-top:0}
.cnt.done{background:var(--accent-soft)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.savebar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0 0 2px;text-wrap:balance}
.sheet .ko{color:var(--muted);font-size:13px;margin-bottom:10px}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 2px;font:600 13px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;margin-bottom:10px}
.stepper button{font:700 22px var(--f-display);border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:10px;cursor:pointer}
.stepper input{text-align:center;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:2px 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600}
.bclist{display:grid;gap:6px;margin:8px 0}
.bcrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:7px 10px;font-size:13.5px}
.bcrow code{font-size:13px;overflow-wrap:anywhere}
.scanbox{display:grid;gap:10px}
.scanbox .camera{padding:18px;font-size:16px}
.camera svg{width:24px;height:24px}
.found{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px}
.pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.pick .row{padding:9px 12px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.toggle input{width:20px;height:20px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:500;max-width:calc(100% - 32px)}
.ro{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
textarea.copy{min-height:140px;font-size:13px;margin-top:8px}
.rhead{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.rhead div{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.rhead b{display:block;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rhead span{font-size:12px;color:var(--muted)}
.rline{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.rline.off{opacity:.55}
.rline.low{border-color:var(--warn)}
.rline .top{display:flex;gap:10px;align-items:flex-start}
.rline .top input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:2px}
.rline .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rline label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.rlines{display:grid;gap:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:-3px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
@media (max-width:420px){.summary{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.tab{font-size:12px;padding:9px 2px}.tiles{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<header>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const CATS=["Et & Tavuk","Dondurulmuş","Sebze & Meyve","Peynir & Süt","Sos","Tortilla & Ekmek","Konserve & Kuru gıda","Baharat","Yağ","İçecek","Ambalaj & Temizlik"];
const LOCS=["Dondurucu","Buzdolabı","Kuru depo","Sebze / Hal","İçecek dolabı","Ambalaj & Temizlik"];
const SUPPLIERS=["Asel Food","Green Mart","Wonplus Mart","Coupang","Costco","Diğer"];
const UNITS=["paket","koli","adet","kg","box","şişe","kutu","teneke","kavanoz","bidon","rulo","çuval"];
const WASTE_REASONS=["Bozuldu / çürüdü","Son kullanma geçti","Düştü / döküldü","Yanlış sipariş","Diğer"];
const KIND_LABEL={in:"+ Geldi",out:"− Kullanıldı",waste:"✕ Zayi",count:"= Sayım"};
const S={items:[],moves:[],tab:"stok",q:"",cat:"Tümü",status:"all",groupBy:"cat",canWrite:true,uid:null,names:{},loaded:false,orderEdits:{},countLoc:LOCS[0],countDraft:{},serial:null};
let db=null,userCap=null,sampleCap=null,imgLimits=null;
S.receipts=[];
S.lists={suppliers:[...SUPPLIERS],units:[...UNITS]}; S.counts=[]; S.countUnit={};
const sups=()=>S.lists.suppliers, units=()=>S.lists.units;
const withCur=(arr,v)=>v&&!arr.includes(v)?[...arr,v]:arr;
const dt=d=>{const x=new Date(d);return x.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+x.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})};
const nameOf=id=>id?(S.names[id]||"…"):"—";
S.rcptDirect=(()=>{const v=(()=>{try{return JSON.parse(localStorage.getItem("ls-rcpt-direct"))}catch(_){return null}})();return v==null?true:!!v})();
const findDup=r=>r.total!=null&&S.receipts.find(x=>x.supplier===r.supplier&&x.date===r.date&&x.total===r.total);
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2});
const fmt=n=>n==null||n===""?"—":nf.format(n);
const won=n=>n==null?"—":nf.format(Math.round(n))+" ₩";
const num=v=>{if(v==null)return null;const s=String(v).trim().replace(/\s/g,"").replace(",",".");if(s==="")return null;const n=Number(s);return isFinite(n)?n:null};
const slug=s=>(s||"urun").toLowerCase().replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"urun";
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
S.countDraft=store.get("ls-count-draft")||{}; S.groupBy=store.get("ls-group")||"cat";

function status(it){
  if(it.qty==null) return {k:"none",t:"Sayılmadı"};
  if(it.qty<=0) return {k:"bad",t:"Bitti"};
  if(it.min!=null && it.qty<=it.min) return {k:"warn",t:"Az kaldı"};
  return {k:"ok",t:"Var"};
}
const needsOrder=it=>it.qty!=null && (it.qty<=0 || (it.min!=null && it.qty<=it.min));
function findByBarcode(code){
  for(const it of S.items){ const b=(it.barcodes||[]).find(x=>x.code===code); if(b) return {it,b}; }
  return null;
}
function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.frequency.value=1200;o.connect(a.destination);o.start();o.stop(a.currentTime+.08)}catch(_){}}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const n=S.items.filter(needsOrder).length; const bd=$("#ordBadge"); bd.hidden=!n; bd.textContent=n;
  $("#fab").hidden=!(S.loaded && S.canWrite && S.tab==="stok");
  $("#saveRoot").innerHTML="";
  const m=$("#main");
  if(!db){ if(S.dbMissing) m.innerHTML=`<div class="note">Stok verisine ulaşılamıyor. Sayfayı claude.ai'ye giriş yapmış olarak açın.</div>`; return; }
  if(!S.loaded){ m.innerHTML=`<div class="note">${S.slow?"Veriye henüz ulaşılamadı. İnternet bağlantısını kontrol edin; bağlanınca liste kendiliğinden gelir.":"Stok listesi yükleniyor…"}</div>`; return; }
  const ro=S.canWrite?"":`<div class="ro">Bu sayfayı sadece görüntüleyebiliyorsunuz. Stok değiştirmek için sahibinden düzenleme izni isteyin.</div>`;
  if(S.tab==="stok") m.innerHTML=ro+renderStock();
  else if(S.tab==="cikis") m.innerHTML=ro+renderOut();

}

function renderStock(){
  const all=S.items;

  const sums=[["all","Tümü",all.length],["bad","Bitti",c.bad],["warn","Az kaldı",c.warn],["none","Sayılmadı",c.none]];
  let h=`<div class="summary">${sums.map(([k,l,v])=>`<button class="sum" data-status="${k}" aria-pressed="${S.status===k}"><b>${v}</b><span>${l}</span></button>`).join("")}</div>`;
  const chipList=S.groupBy==="loc"?["Tümü",...LOCS]:["Tümü",...CATS];
  h+=`<div class="tools"><input id="q" type="search" placeholder="Ürün ara (Türkçe, Korece veya barkod)" value="${esc(S.q)}" autocomplete="off">
  <div class="bar"><div class="seg2" role="group" aria-label="Gruplama"><button data-group="cat" aria-pressed="${S.groupBy==="cat"}">Kategoriye göre</button><button data-group="loc" aria-pressed="${S.groupBy==="loc"}">Yere göre</button></div>${S.canWrite?`<button class="btn ghost sm" data-act="lists">Tedarikçi & birim listesi</button>`:""}</div>

  const q=S.q.trim().toLocaleLowerCase("tr");
  const key=i=>S.groupBy==="loc"?(i.location||"Yeri belirtilmemiş"):(i.category||"Diğer");
  const rows=all.filter(i=>(S.cat==="Tümü"||key(i)===S.cat)&&(S.status==="all"||status(i).k===S.status)&&(!q||[i.name,i.ko,i.supplier,i.size,...(i.barcodes||[]).map(b=>b.code)].join(" ").toLocaleLowerCase("tr").includes(q)));
  if(!all.length) return h+`<div class="note">Henüz ürün yok. Sağ alttaki <b>+ Ürün ekle</b> ile ilk ürünü ekleyin.</div>`;

function rowHTML(i){

  const q=S.outQ.trim().toLocaleLowerCase("tr");

  if(fav.length) h+=`<section class="group"><h2>Sık kullanılanlar</h2><div class="tiles">${fav.map(tile).join("")}</div></section>`;
  const g={}; items.forEach(i=>(g[i.location||"Yeri belirtilmemiş"]??=[]).push(i));

  const tl=Object.values(td).sort((a,b)=>a.name.localeCompare(b.name,"tr"));

const outBusy=new Set();
async function quickOut(id){
  const it=S.items.find(i=>i.id===id); if(!it||outBusy.has(id)||!S.canWrite) return;
  outBusy.add(id);
  try{
    const k=S.outMode; const res=await applyMove(it,k,1,"",k==="waste"?{reason:S.outReason}:{},true);
    beep();
    toastUndo(`${it.name}: −1 → ${fmt(res.after)} ${it.unit||""}`,async()=>{
      try{ await db.doc("items/"+id).update({qty:res.before,updatedAt:nowISO(),updatedBy:S.uid}); if(res.ref) await res.ref.delete(); toast("Geri alındı"); }catch(e){writeErr(e)}
    });
  }catch(e){writeErr(e)} finally{outBusy.delete(id)}
}
function toastUndo(msg,fn){
  const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}<button id="undoBtn">Geri al</button></div>`;
  $("#undoBtn").onclick=()=>{r.innerHTML="";fn()};
  clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",6000);
}

function suggest(i){ if(i.target!=null) return Math.max(0,Math.ceil(i.target-(i.qty||0))); return null; }
function renderOrders(){
  const list=S.items.filter(needsOrder);
  const noMin=S.items.filter(i=>i.min==null).length;
  let h=`<p class="hint">Stoğu biten ya da minimumun altına düşen ürünler, tedarikçiye göre gruplanır. Miktarı düzeltip <b>Kopyala</b> ile WhatsApp mesajına yapıştırın.</p>`;
  if(!list.length) h+=`<div class="note">Şu an sipariş gereken ürün yok.</div>`;
  const g={}; list.forEach(i=>(g[i.supplier||"Tedarikçi belirtilmemiş"]??=[]).push(i));
  Object.keys(g).sort().forEach(sup=>{
    let total=0,priced=0;
    g[sup].forEach(i=>{const v=num(S.orderEdits[i.id]??suggest(i));if(v&&i.price!=null){total+=v*i.price;priced++}});
    h+=`<div class="ord-card"><div class="ord-head"><h3>${esc(sup)}</h3><button class="btn ghost sm" data-copy="${esc(sup)}">Kopyala</button></div>`;
    g[sup].sort((a,b)=>a.name.localeCompare(b.name,"tr")).forEach(i=>{
      const v=S.orderEdits[i.id]??suggest(i)??"";
      h+=`<div class="ord-line"><div><div class="rname">${esc(i.name)}</div><div class="rsub">${i.ko?esc(i.ko)+" · ":""}stokta ${fmt(i.qty)} ${esc(i.unit||"")}${i.min!=null?` · min ${fmt(i.min)}`:""}</div></div>
      <div style="display:flex;align-items:center;gap:6px"><input inputmode="decimal" id="ord-${esc(i.id)}" data-ord="${esc(i.id)}" value="${esc(v)}" placeholder="?" aria-label="Sipariş miktarı"><span class="rsub">${esc(i.unit||"")}</span></div></div>`;
    });
    if(priced) h+=`<p class="hint" style="margin:8px 0 0">Tahmini tutar: <b>${won(total)}</b> (son fiyatlarla, ${priced} ürün)</p>`;
    h+=`<div id="copyfb-${slug(sup)}"></div></div>`;
  });
  if(noMin) h+=`<p class="hint">${noMin} üründe minimum stok girilmemiş; bu ürünler sadece tamamen bitince listeye düşer. Ürüne dokunup <b>Ayarlar</b>'dan minimum girebilirsiniz.</p>`;
  return h;
}

function renderLog(){
  if(!S.moves.length) return `<div class="note">Henüz hareket yok. Mal girişi, kullanım, zayi ve sayımlar burada kimin yaptığıyla birlikte görünür.</div>`;
  const icon={in:"+",out:"−",waste:"✕",count:"=",edit:"✎",add:"+"}, cls={in:"k-in",out:"k-out",waste:"k-waste",count:"k-count",edit:"k-edit",add:"k-edit"};
  const verb={in:"Mal girişi",out:"Kullanıldı",waste:"Zayi",count:"Sayım",edit:"Bilgiler düzenlendi",add:"Ürün eklendi"};
  const since=Date.now()-7*864e5; const wk=S.moves.filter(m=>m.at&&new Date(m.at).getTime()>=since);
  const priceOf=id=>S.items.find(i=>i.id===id)?.price;
  const wasteVal=wk.filter(m=>m.kind==="waste").reduce((s,m)=>s+(m.amount||0)*(priceOf(m.itemId)||0),0);
  const stats=`<div class="stats"><div class="stat"><b>${wk.filter(m=>m.kind==="in").length}</b><span>Mal girişi (7 gün)</span></div><div class="stat"><b>${wk.filter(m=>m.kind==="waste").length}</b><span>Zayi (7 gün)</span></div><div class="stat"><b>${won(wasteVal)}</b><span>Zayi değeri (yaklaşık)</span></div></div>`;
  return stats+`<p class="hint">Son ${S.moves.length} hareket.</p><div class="log">${S.moves.map(m=>{
    const who=m.by?(S.names[m.by]||"Biri"):"—";
    const d=m.at?new Date(m.at):null;
    const when=d?d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"";
    const amt=m.kind==="count"?`${fmt(m.before)} → ${fmt(m.after)} ${esc(m.unit||"")}${m.diff<0?` · <b style="color:var(--bad)">kayıt dışı ${fmt(m.diff)}</b>`:""}`:(["in","out","waste"].includes(m.kind))?`${m.kind==="in"?"+":"−"}${fmt(m.amount)} ${esc(m.unit||"")} → ${fmt(m.after)}`:"";
    return `<div class="log-item"><div class="kind ${cls[m.kind]||"k-edit"}">${icon[m.kind]||"•"}</div>
    <div style="min-width:0"><div class="rname">${esc(m.name)}</div><div class="rsub">${verb[m.kind]||""}${amt?" · "+amt:""}${m.reason?" · "+esc(m.reason):""}${m.barcode?" · barkodla":""}${m.note?" · "+esc(m.note):""}</div></div>
    <div class="log-when">${esc(who)}<br>${when}</div></div>`}).join("")}</div>`;
}

function receiptPrompt(){
  const cat=S.items.map(i=>[i.id,i.name,i.ko||"",i.size||"",i.unit||"",i.supplier||""].join(" | ")).join("\n");
  return `Bu fotoğraf(lar) Kore'deki "Last Stop" restoranının bir tedarikçi fişi (거래명세서 / fatura / market fişi). Fişi oku ve kalemleri aşağıdaki stok listesiyle eşleştir. Birden fazla fotoğraf varsa aynı fişin sayfalarıdır.

${cat}

KURALLAR:
- Fişteki her ürün satırı için bir kalem yaz. Ara toplam, KDV, önceki bakiye, ödeme satırlarını kalem yapma. Fişte el yazısı notlar varsa yok say.
- qty: fişteki toplam miktar (총수량, yoksa 수량). unitPrice: fişteki birim fiyat (단가). amount: satır tutarı (금액 / 공급가액).
- itemId: listedeki en uygun ürünün id'si. Emin değilsen null. Farklı marka ama aynı ürün ise yine eşleştir ve why alanına yaz.
- stockQty: bu satırın, eşleşen ürünün STOK BİRİMİNE çevrilmiş miktarı. Örnek: stok birimi "paket", fişte "1kg*10pk" ve 총수량 10 ise stockQty=10. BOX/koli sayısı ile paket sayısını karıştırma; 총수량 genelde en küçük birimdir. Çeviri belirsizse makul tahmin yap ve confidence "low" ver.
- stockUnit: eşleşen ürünün stok birimi boşsa, bu satır için en uygun birimi yaz (şunlardan biri: ${units().join(", ")}); doluysa o birimi tekrar yaz.
- stockPrice: bir stok biriminin fiyatı (₩). KDV fişte ayrıca ekleniyorsa KDV hariç fiyatı yaz.

- vatSeparate: KDV (세액) toplamın üstüne ayrıca ekleniyorsa true.

SADECE şu biçimde JSON döndür:
{"supplier":"Asel Food","date":"2026-11-02","total":826640,"vatSeparate":false,"lines":[{"text":"세이)5\\"밀또띠아 12ea*40pk","qty":40,"unitPrice":2000,"amount":80000,"itemId":"tortilla-5-taco","stockQty":40,"stockUnit":"paket","stockPrice":2000,"confidence":"high","why":""}]}`;
}
async function readReceipt(files){
  if(!sampleCap) return;
  const max=imgLimits?.maxCount||1;
  files=[...files].slice(0,max);
  sheet={mode:"receipt",state:"busy",progress:"Claude fişi okuyor. Bu genelde 30–90 saniye sürer…"}; drawSheet();
  rctl=new AbortController();
  try{
    const res=await sampleCap.json(receiptPrompt(),{images:files,signal:rctl.signal,onText:()=>{if(sheet&&sheet.mode==="receipt"&&sheet.state==="busy"&&!sheet.writing){sheet.writing=true;sheet.progress="Kalemler yazılıyor…";drawSheet()}}});
    if(!sheet||sheet.mode!=="receipt") return;
    const lines=Array.isArray(res&&res.lines)?res.lines:[];
    if(!lines.length) throw {code:"empty"};
    const ids=new Set(S.items.map(i=>i.id));
    sheet={mode:"receipt",state:"review",r:{
      supplier:String(res.supplier||""),date:res.date?String(res.date):"",total:num(res.total),vatSeparate:!!res.vatSeparate,
      lines:lines.map(l=>{const itemId=ids.has(l.itemId)?l.itemId:"";return {text:String(l.text||"?"),qty:num(l.qty),unitPrice:num(l.unitPrice),amount:num(l.amount),itemId,
        stockQty:num(l.stockQty)??num(l.qty),stockUnit:String(l.stockUnit||""),stockPrice:num(l.stockPrice)??num(l.unitPrice),low:l.confidence==="low"||!itemId,why:String(l.why||""),include:!!itemId}})
    }};
    if(S.rcptDirect&&S.canWrite&&!findDup(sheet.r)&&sheet.r.lines.some(l=>l.include)){ await saveReceipt(); return; }
    drawSheet();
  }catch(e){
    if(e&&e.code==="cancelled"){closeSheet();return}
    const msg={not_granted:"Claude kullanımına izin verilmedi. Fiş okuma bu oturumda kapalı.",sampling_disabled:"Bu hesapta Claude kullanılamıyor.",rate_limited:"Çok sık deneme yapıldı ya da kullanım sınırına gelindi. Biraz sonra tekrar deneyin.",
      image_rejected:"Fotoğraf kabul edilmedi. JPG/PNG bir fotoğraf seçin.",images_unavailable:"Bu cihazda fotoğraf gönderilemiyor.",invalid_json:"Fiş okunamadı. Fişi düz, yakından ve tamamı görünecek şekilde çekip tekrar deneyin.",
      empty:"Fişte ürün satırı bulunamadı. Fotoğrafta fişin tamamı ve yazılar net görünmeli.",refused:"Bu fotoğraf işlenemedi. Başka bir fotoğraf deneyin.",session_expired:"Oturum kapanmış, claude.ai'ye tekrar giriş yapın."}[e&&e.code]||"Bağlantı sorunu oldu. Tekrar deneyin.";
    sheet={mode:"receipt",state:"error",err:msg}; drawSheet();
    if(e&&["not_granted","sampling_disabled","images_unavailable"].includes(e.code)){sampleCap=null;$("#rcptBtn").hidden=true}
  }
}

    ${low.length?`<p class="hint" style="margin-top:8px">${low.length} kalemde birim çevirisi tahmini yapıldı. Yanlışsa ürüne dokunup <b>= Sayım</b> ile düzeltin.</p>`:""}

  const sum=r.lines.reduce((a,l)=>a+(l.amount||0),0);

async function saveReceipt(){
  const r=sheet.r; if(busy) return; busy=true;
  const label=[r.supplier,r.date].filter(Boolean).join(" ")||"Fiş";
  const chosen=r.lines.filter(l=>!l.added&&l.include&&l.itemId&&num(l.stockQty)>0);
  sheet.state="saving"; sheet.progress=`${chosen.length} kalem kaydediliyor…`; drawSheet();
  let ok=0;
  try{
    const agg={};
    for(const l of chosen){
      if(l.itemId==="__new"){
        const id=slug(l.text)+"-"+Date.now().toString(36).slice(-4)+ok;
        await db.doc("items/"+id).set({name:l.text,ko:l.text,category:"",location:"",supplier:sups().includes(r.supplier)?r.supplier:"",unit:l.stockUnit||"",size:"",qty:num(l.stockQty),min:null,target:null,price:num(l.stockPrice),priceFor:"1 adet"+(r.vatSeparate?", +%10 KDV":""),note:"Fişten eklendi, adını ve birimini düzeltin",barcodes:[],createdAt:nowISO(),updatedAt:nowISO(),updatedBy:S.uid});
        logMove({itemId:id,name:l.text,kind:"add",unit:"adet",after:num(l.stockQty),note:"Fiş: "+label}); ok++; continue;
      }
      const a=agg[l.itemId]??={qty:0,price:null,unit:""}; a.qty+=num(l.stockQty); if(num(l.stockPrice)!=null) a.price=num(l.stockPrice); if(l.stockUnit) a.unit=l.stockUnit;
    }
    for(const [id,a] of Object.entries(agg)){
      const it=S.items.find(i=>i.id===id); if(!it) continue;
      await applyMove(it,"in",Math.round(a.qty*100)/100,"Fiş: "+label,{price:a.price,unit:a.unit,supplier:sups().includes(r.supplier)?r.supplier:""},true); ok++;
    }
    chosen.forEach(l=>l.added=true);
    const rec={supplier:r.supplier,date:r.date,total:r.total,vatSeparate:r.vatSeparate,
      lines:r.lines.map(l=>({text:l.text,qty:l.qty,unitPrice:l.unitPrice,amount:l.amount,itemId:l.added?l.itemId:"",stockQty:num(l.stockQty)})),by:S.uid,at:nowISO()};
    if(!r.saved){ const ref=await db.collection("receipts").add(rec); r.saved=ref.id; }
    else { await db.doc("receipts/"+r.saved).set(rec); }
    sheet.state="done"; drawSheet(); toast(`${ok} kalem stoğa eklendi (${label})`);
  }catch(e){ writeErr(e); sheet.state="review"; drawSheet(); }
  finally{ busy=false }
}

  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
    const tries=[1600,1000,2400];
    for(const max of tries){
      const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      if("BarcodeDetector" in window){try{const r=await new window.BarcodeDetector().detect(c);if(r&&r.length)return r[0].rawValue}catch(_){}}
      if(window.ZXing){
        for(const rot of [0,90]){
          try{
            let src=c;
            if(rot){src=document.createElement("canvas");src.width=c.height;src.height=c.width;const x=src.getContext("2d");x.translate(src.width/2,src.height/2);x.rotate(Math.PI/2);x.drawImage(c,-c.width/2,-c.height/2)}
            const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
            const rd=new ZXing.MultiFormatReader();rd.setHints(hints);
            const bb=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(src)));
            return rd.decode(bb).getText();
          }catch(_){}
        }
      }
    }
    return null;
  } finally { URL.revokeObjectURL(url) }
}
async function handleCode(code){
  code=String(code||"").trim(); if(!code) return;
  const hit=findByBarcode(code);
  if(hit){
    beep();
    if(S.serial&&S.canWrite){
      await applyMove(hit.it,S.serial,hit.b.mult||1,"",{barcode:code});
      if(sheet&&sheet.mode==="scan"){sheet.state="idle";drawSheet();}
      return;
    }
    openItem(hit.it.id,{kind:"in",amount:hit.b.mult||1,touched:true,scanned:{code,mult:hit.b.mult||1}});
    return;
  }
  sheet={mode:"scan",state:"unknown",code,mult:1,pickQ:""}; drawSheet();
}
async function linkBarcode(itemId,code,mult){

  const other=findByBarcode(code); if(other&&other.it.id!==itemId){toast(`Bu barkod zaten "${other.it.name}" ürününe bağlı.`);return}
  const list=[...(it.barcodes||[]).filter(b=>b.code!==code),{code,mult:mult||1}];
  try{ await db.doc("items/"+it.id).update({barcodes:list,updatedAt:nowISO(),updatedBy:S.uid}); toast(`Barkod "${it.name}" ürününe bağlandı`);

       logMove({itemId:it.id,name:it.name,kind:"edit",note:"Barkod eklendi: "+code});

/* hardware scanners type fast and end with Enter */
let kb={buf:"",last:0};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet){closeSheet();return}
  const t=e.target; const typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT");
  if(t&&t.id==="bcman"&&e.key==="Enter"){e.preventDefault();handleCode(t.value);return}
  if(typing) return;
  const now=performance.now();
  if(e.key==="Enter"){ if(kb.buf.length>=6){ e.preventDefault(); handleCode(kb.buf); } kb.buf=""; return; }
  if(e.key.length===1){ if(now-kb.last>80) kb.buf=""; kb.buf+=e.key; kb.last=now; }
});

}
let busy=false;
async function applyMove(it,k,a,note,extra,silent){
  const before=it.qty??null;
  let after=k==="count"?a:(before||0)+(k==="in"?a:-a); if(after<0) after=0;
  after=Math.round(after*100)/100;
  const upd={qty:after,updatedAt:nowISO(),updatedBy:S.uid};
  if(extra&&extra.price!=null&&extra.price!==it.price) upd.price=extra.price;
  if(extra&&extra.supplier&&extra.supplier!==it.supplier) upd.supplier=extra.supplier;
  if(extra&&extra.unit&&!it.unit) upd.unit=extra.unit;
  await db.doc("items/"+it.id).update(upd);
  if(!silent) toast(`${it.name}: ${fmt(after)} ${it.unit||""}`);
  const m={itemId:it.id,name:it.name,kind:k,amount:a,before,after,unit:upd.unit||it.unit||"",note:note||""};
  if(upd.supplier) m.note=(m.note?m.note+" · ":"")+`tedarikçi: ${upd.supplier}`;
  if(extra&&extra.reason) m.reason=extra.reason;
  if(extra&&extra.barcode) m.barcode=extra.barcode;
  if(upd.price!=null) m.note=(m.note?m.note+" · ":"")+`fiyat ${won(it.price)} → ${won(upd.price)}`;
  const ref=await logMove(m);
  return {before,after,ref};
}

const COUNT_NOTE="Sayım";
const COUNT_NOTES=["Sayım","Haftalık sayım","Sayım turu"];
async function saveCount(){
  const ids=Object.keys(S.countDraft).filter(k=>draftVal(k)!=null);
  if(!ids.length||busy) return; busy=true;
  const rows=[]; const at=nowISO();
  for(const id of ids){
    const it=S.items.find(i=>i.id===id); const v=num(S.countDraft[id]); if(!it||v==null||v<0){delete S.countDraft[id];continue}
    const before=it.qty??null; const diff=before==null?null:Math.round((v-before)*100)/100;
    const unit=it.unit||S.countUnit[id]||"";
    const upd={qty:v,countedAt:at,countedBy:S.uid,updatedAt:at,updatedBy:S.uid}; if(!it.unit&&unit) upd.unit=unit;
    try{ await db.doc("items/"+id).update(upd);
         if(diff!==0) await logMove({itemId:id,name:it.name,kind:"count",amount:v,before,after:v,diff,unit,note:COUNT_NOTE});
         delete S.countDraft[id]; delete S.countUnit[id];
         rows.push({itemId:id,name:it.name,unit,before,after:v,diff,price:it.price??null}); }catch(e){writeErr(e);break}
  }
  store.set("ls-count-draft",S.countDraft);
  if(rows.length){ try{ await db.collection("counts").add({at,by:S.uid,locations:[...new Set(rows.map(r=>S.items.find(i=>i.id===r.itemId)?.location||""))],rows}); }catch(e){console.warn(e)} }
  busy=false; render();

}

  ${extra.length?`<p class="hint" style="margin-top:12px"><b>Kayıttan fazla çıkanlar:</b> mal girişi kaydedilmemiş olabilir (fiş okutulmamış).</p><div class="list" style="padding:0 14px">${extra.map(r=>line(r,1)).join("")}</div>`:""}

  <div class="actions"><button class="btn" data-act="close">Tamam</button></div>`;
}

  });
  const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
  db.collection("receipts").orderBy("at","desc").limit(60).onSnapshot(s=>{S.receipts=s.docs.map(d=>({id:d.id,...d.data()}))},()=>{});
  db.collection("counts").orderBy("at","desc").limit(40).onSnapshot(s=>{S.counts=s.docs.map(d=>({id:d.id,...d.data()}));resolveNames();if(S.tab==="sayim"&&!editingInline())render()},()=>{});
  db.doc("settings/lists").onSnapshot(d=>{if(d.exists){const x=d.data();S.lists={suppliers:Array.isArray(x.suppliers)?x.suppliers:[...SUPPLIERS],units:Array.isArray(x.units)?x.units:[...UNITS]};if(sheet&&sheet.mode==="lists")drawSheet()}},()=>{});
  db.collection("items").onSnapshot(s=>{
    S.items=s.docs.map(d=>({id:d.id,...d.data()})); S.loaded=true; resolveNames();
    if(!s.metadata.fromCache){clearTimeout(timer);setSync("Canlı · herkes aynı listeyi görüyor")} else setSync("Kayıtlı kopya gösteriliyor…");
    if(sheet&&sheet.mode==="move"&&!document.querySelector("#sheetRoot details[open]")){const a=$("#amt")?.value,n=$("#mnote")?.value;drawSheet();if(a!=null&&$("#amt"))$("#amt").value=a;if(n!=null&&$("#mnote"))$("#mnote").value=n;}
    if(!editingInline()) render();
  },()=>{clearTimeout(timer);S.loaded=true;setSync("Bağlantı koptu, sayfayı yeniden açın");render()});
  db.collection("moves").orderBy("at","desc").limit(200).onSnapshot(s=>{
    S.moves=s.docs.map(d=>({id:d.id,...d.data()})); resolveNames(); if((S.tab==="hareket"||S.tab==="cikis")&&!editingInline())render();
  },()=>{});
}
start();
</script>
<script>
(function(){const box=document.querySelector(".hrow > div");if(!box)return;const b=document.createElement("button");b.className="btn ghost sm";b.style.padding="8px 10px";
let n="";try{n=localStorage.getItem("ls-staff-name")||""}catch(_){}b.textContent=n?n.split(" ")[0]:"Kişi";b.title="Kişi değiştir";b.setAttribute("aria-label","Kişi değiştir: "+n);
b.onclick=()=>{if(confirm((n?n+" olarak giriş yapıldı. ":"")+"Kişi değiştirilsin mi?"))lsSwitchUser()};box.prepend(b)})();
</script>
